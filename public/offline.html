<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Invocely</title>
    <style>
        body { font-family: -apple-system, sans-serif; min-height: 100vh; margin: 0;
               display: flex; align-items: center; justify-content: center;
               background: linear-gradient(135deg, #FFF8FE 0%, #FFE4F1 50%, #EDE9FE 100%); padding: 20px; }
        .card { background: white; border-radius: 24px; padding: 40px; max-width: 400px;
                text-align: center; box-shadow: 0 8px 30px rgba(167,139,250,0.2); }
        h1 { font-size: 24px; color: #6D28D9; margin: 12px 0; }
        p { color: #7C3AED; font-size: 14px; line-height: 1.6; }
        button { background: linear-gradient(135deg, #FF7AC6, #A78BFA); color: white;
                 border: none; padding: 12px 32px; border-radius: 12px; font-weight: bold;
                 cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <p style="font-size: 60px; margin: 0;">📵</p>
        <h1>Kamu Sedang Offline</h1>
        <p>Tidak bisa akses Invocely sekarang karena ga ada koneksi internet. Cek koneksi WiFi/data, lalu coba lagi.</p>
        <button onclick="location.reload()">↻ Coba Lagi</button>
    </div>
</body>
</html>
